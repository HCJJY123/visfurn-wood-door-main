<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><title>VISFURN growth preview QA</title><style>body{margin:12px;background:#dce1de;font:14px Arial}header{position:sticky;top:0;background:white;padding:12px;z-index:2}select,button{padding:8px}iframe{display:block;margin:20px auto;background:white;border:0}pre{white-space:pre-wrap}</style></head><body><header><label>Page <select id="route"><option value="/blog/interior-door-delivery-storage-site-readiness-checklist">Receiving guide</option><option value="/products/interior-doors">Interior doors</option><option value="/blog">Blog</option></select></label><label>Width <select id="width"><option>375</option><option selected>390</option><option>1440</option></select></label><button id="audit">Audit pages and widths</button><span id="status">Ready</span></header><iframe id="device" width="390" height="820" title="Responsive page"></iframe><pre id="result"></pre><script>
const route=document.querySelector('#route'),width=document.querySelector('#width'),device=document.querySelector('#device'),result=document.querySelector('#result'),status=document.querySelector('#status');
function load(){device.style.width=width.value+'px';device.src=route.value}route.onchange=load;width.onchange=()=>device.style.width=width.value+'px';
document.querySelector('#audit').onclick=async()=>{const rows=[];for(const size of [375,390,1440])for(const path of [...route.options].map(o=>o.value)){route.value=path;width.value=size;await new Promise(r=>{device.onload=()=>setTimeout(r,1000);load()});const d=device.contentDocument,w=device.contentWindow;rows.push({path,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,h1:[...d.querySelectorAll('h1')].map(e=>e.textContent),canonical:d.querySelector('link[rel=canonical]')?.href,quoteLinks:d.querySelectorAll('a[href="/contact#quote-form"]').length});result.textContent=JSON.stringify(rows,null,2);status.textContent=rows.length+'/9';}status.textContent='Complete';};load();</script></body></html>
