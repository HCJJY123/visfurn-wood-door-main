<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>VISFURN responsive QA — preview only</title><style>body{margin:16px;background:#d9dce0;font:14px Arial;color:#182520}header{position:sticky;top:0;background:white;padding:12px;z-index:9}select,button{padding:8px;margin:4px}iframe{display:block;border:0;background:white;margin:16px auto}pre{white-space:pre-wrap;background:#fff;padding:14px}</style></head><body><header><label>Product <select id="route"></select></label><label>Width <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select></label><button id="scan">Measure current page</button><button id="suite">Audit all products and widths</button><span id="progress">Ready</span></header><iframe id="device" title="Product mobile viewport" width="390" height="844"></iframe><pre id="result"></pre><script>
const routes=["/products/exterior-doors/modern-european-apartment-door","/products/exterior-doors/smart-steel-entrance-door","/products/fire-security-doors/fire-rated-steel-security-door","/products/fire-security-doors/steel-fire-door-for-house","/products/hospital-doors/automatic-hermetic-sliding-door","/products/hospital-doors/modern-laboratory-door","/products/hotel-doors/french-style-glazed-suite-door","/products/hotel-doors/hotel-guestroom-door","/products/hotel-doors/modern-finished-hotel-interior-door","/products/interior-doors/modern-pvc-wooden-door","/products/interior-doors/white-moulded-solid-wood","/products/school-doors/custom-color-classroom-door","/products/school-doors/galvanized-steel-school-door","/products/wooden-doors/paint-free-brown-wooden-interior-door","/products/wooden-doors/soundproof-composite-entry-door","/products/wpc-doors/modern-grooved-wpc-interior-door","/products/wpc-doors/moulded-panel-wpc-interior-door","/products/wpc-doors/waterproof-wpc-interior-door"];const route=document.querySelector('#route'),width=document.querySelector('#width'),device=document.querySelector('#device'),result=document.querySelector('#result'),progress=document.querySelector('#progress');
for(const p of routes){const o=document.createElement('option');o.value=p;o.textContent=p;route.append(o);}
function load(){device.style.width=width.value+'px';device.src=route.value;}
route.onchange=load;width.onchange=()=>{device.style.width=width.value+'px';};
function measure(){const w=device.contentWindow,d=device.contentDocument,v=w.innerWidth;const vis=e=>{let r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden';};
let bad=[...d.querySelectorAll('main *')].filter(e=>{if(!vis(e))return false;let r=e.getBoundingClientRect();if(r.right<=v+1&&r.left>=-1)return false;for(let p=e.parentElement;p&&p!==d.body;p=p.parentElement)if(['auto','scroll','hidden','clip'].includes(w.getComputedStyle(p).overflowX))return false;return true;}).slice(0,8).map(e=>({tag:e.tagName,cls:e.className,text:e.textContent.trim().slice(0,40),x:Math.round(e.getBoundingClientRect().x),right:Math.round(e.getBoundingClientRect().right)}));
return {route:route.value,width:v,scrollWidth:d.documentElement.scrollWidth,overflow:bad,h1:[...d.querySelectorAll('h1')].map(e=>({x:e.getBoundingClientRect().x,width:e.getBoundingClientRect().width})),header:[...d.querySelectorAll('.vf-site-nav .brand,.vf-site-nav .vf-header-actions,.vf-site-nav .vf-language-switcher,.vf-site-nav .vf-menu-toggle')].map(e=>({cls:e.className,x:Math.round(e.getBoundingClientRect().x),right:Math.round(e.getBoundingClientRect().right)}))};}
document.querySelector('#scan').onclick=()=>{result.textContent=JSON.stringify(measure(),null,2);};
document.querySelector('#suite').onclick=async()=>{const results=[];for(const size of [320,375,390,430,768,1440])for(const p of routes){width.value=size;route.value=p;await new Promise(resolve=>{device.onload=()=>setTimeout(resolve,300);load();});results.push(measure());progress.textContent=results.length+'/108';result.textContent=JSON.stringify(results,null,2);}progress.textContent='Complete: '+results.length;};
load();
</script></body></html>
