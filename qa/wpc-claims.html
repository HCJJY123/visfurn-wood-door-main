<!doctype html><meta name="robots" content="noindex,nofollow"><title>WPC reading QA</title><style>body{margin:12px;background:#e6e9e6;font:14px Arial}header{padding:12px;background:white}iframe{display:block;margin:16px auto;border:0;background:white}pre{white-space:pre-wrap}</style><header><label>Width <select id="width"><option>375</option><option selected>390</option><option>1440</option></select></label> <button id="audit">Audit</button><span id="status">Ready</span></header><iframe id="device" title="WPC sourcing article" width="390" height="850" src="/blog/wpc-doors-commercial-sourcing-guide-2026"></iframe><pre id="result"></pre><script>const device=document.querySelector('#device'),width=document.querySelector('#width'),result=document.querySelector('#result'),status=document.querySelector('#status');width.onchange=()=>device.style.width=width.value+'px';document.querySelector('#audit').onclick=async()=>{let rows=[];for(let size of [375,390,1440]){device.style.width=size+'px';await new Promise(r=>setTimeout(r,700));let d=device.contentDocument,w=device.contentWindow,article=d.querySelector('article'),hero=d.querySelector('.hero-img'),table=d.querySelector('table');rows.push({width:size,scrollWidth:d.documentElement.scrollWidth,h1:d.querySelectorAll('h1').length,canonical:d.querySelector('link[rel=canonical]').href,padding:w.getComputedStyle(article).padding,hero:{width:hero.clientWidth,height:hero.clientHeight,loaded:hero.complete&&hero.naturalWidth>0},table:{width:table.clientWidth,scrollWidth:table.scrollWidth},cta:d.querySelector('.cta-btn').getAttribute('href')});}result.textContent=JSON.stringify(rows,null,2);device.style.width=width.value+'px';status.textContent='Complete';};</script>
