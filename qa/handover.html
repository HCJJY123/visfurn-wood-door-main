<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><title>Handover guide QA</title><style>body{margin:12px;background:#e5e9e5;font:14px Arial}header{padding:12px;background:white;position:sticky;top:0;z-index:2}select,button{padding:8px}iframe{display:block;margin:16px auto;border:0;background:white}pre{white-space:pre-wrap}</style></head><body><header><select id="route" aria-label="Page"><option>/blog/project-door-handover-spares-maintenance-records</option><option>/products/hotel-doors</option><option>/blog</option></select><select id="width" aria-label="Width"><option>375</option><option selected>390</option><option>1440</option></select><button id="audit">Audit widths</button><span id="status">Ready</span></header><iframe id="device" title="Responsive page" width="390" height="800"></iframe><pre id="result"></pre><script>
const route=document.querySelector('#route'),width=document.querySelector('#width'),device=document.querySelector('#device'),result=document.querySelector('#result'),status=document.querySelector('#status');
function load(){device.style.width=width.value+'px';device.src=route.value+'?qa=handover'}route.onchange=load;width.onchange=()=>device.style.width=width.value+'px';
document.querySelector('#audit').onclick=async()=>{const rows=[];for(const size of [375,390,1440])for(const path of [...route.options].map(o=>o.value)){route.value=path;width.value=size;await new Promise(r=>{device.onload=()=>setTimeout(r,800);load()});const d=device.contentDocument,w=device.contentWindow;rows.push({path,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,h1:d.querySelectorAll('h1').length,canonical:d.querySelector('link[rel=canonical]')?.href,languageLinks:d.querySelectorAll('[data-vf-language-link]').length,mainLinks:[...d.querySelectorAll('main a')].map(a=>a.getAttribute('href')),tables:[...d.querySelectorAll('main table')].map(t=>({left:t.getBoundingClientRect().left,right:t.getBoundingClientRect().right})),routeText:d.querySelector('.route p')?w.getComputedStyle(d.querySelector('.route p')).color:null});result.textContent=JSON.stringify(rows,null,2);status.textContent=rows.length+'/9';}status.textContent='Complete';};load();</script></body></html>
