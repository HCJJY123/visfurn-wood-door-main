<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><title>Language UI QA</title><style>body{margin:12px;background:#e5e9e5;font:14px Arial}header{padding:12px;background:white;position:sticky;top:0;z-index:2}select,button{padding:8px}iframe{display:block;margin:16px auto;border:0;background:white}pre{white-space:pre-wrap}</style></head><body><header><select id="route" aria-label="Page"><option>/</option><option>/products/interior-doors/modern-pvc-wooden-door</option><option>/blog/interior-door-delivery-storage-site-readiness-checklist</option><option>/fr/blocs-portes-interieures</option><option>/ru/mezhkomnatnye-dveri</option><option>/br/portas-internas-de-madeira-sob-medida</option><option>/ar/wpc-doors</option><option>/es/puertas-para-proyectos</option><option>/mn</option></select><select id="width" aria-label="Width"><option>320</option><option>375</option><option selected>390</option><option>1440</option></select><button id="audit">Audit widths</button><span id="status">Ready</span></header><iframe id="device" title="Responsive page" width="390" height="800"></iframe><pre id="result"></pre><script>
const route=document.querySelector('#route'),width=document.querySelector('#width'),device=document.querySelector('#device'),result=document.querySelector('#result'),status=document.querySelector('#status');
function load(){device.style.width=width.value+'px';device.src=route.value+'?qa=language-v3'}route.onchange=load;width.onchange=()=>device.style.width=width.value+'px';
document.querySelector('#audit').onclick=async()=>{const rows=[];for(const size of [320,375,390,1440])for(const path of [...route.options].map(o=>o.value)){route.value=path;width.value=size;await new Promise(r=>{device.onload=()=>setTimeout(r,650);load()});const d=device.contentDocument,w=device.contentWindow,b=d.querySelector('.vf-language-trigger');if(b)b.click();const panel=d.querySelector('.vf-language-panel'),pr=panel?.getBoundingClientRect();rows.push({panel:pr?{left:pr.left,right:pr.right,top:pr.top,bottom:pr.bottom}:null,path,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,lang:d.documentElement.lang,code:d.querySelector('[data-vf-language-code]')?.textContent,count:d.querySelectorAll('[data-vf-language-link]').length,button:b?{x:b.getBoundingClientRect().x,y:b.getBoundingClientRect().y,width:b.offsetWidth,height:b.offsetHeight}:null});result.textContent=JSON.stringify(rows,null,2);status.textContent=rows.length+'/36';}status.textContent='Complete';};load();</script></body></html>
