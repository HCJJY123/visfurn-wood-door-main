<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width"><title>VISFURN preview QA only</title><style>body{margin:0;font:14px sans-serif}header{padding:8px}iframe{display:block;border:0;width:390px;height:840px}pre{white-space:pre-wrap}</style></head><body><header><label>Page <select id="route"><option value="/blog/door-sample-approval-checklist-before-mass-production">Sample approval</option><option value="/products/interior-doors">Interior doors</option><option value="/blog">Blog</option></select></label><label>Width <select id="width"><option>375</option><option selected>390</option><option>1440</option></select></label><button id="audit">Run layout checks</button></header><iframe id="device" title="Responsive preview" src="/blog/door-sample-approval-checklist-before-mass-production"></iframe><pre id="results"></pre><script>
const frame=document.getElementById('device'),route=document.getElementById('route'),width=document.getElementById('width'),out=document.getElementById('results');
route.onchange=()=>frame.src=route.value;width.onchange=()=>frame.style.width=width.value+'px';
function load(u){return new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,800);frame.src=u;});}
document.getElementById('audit').onclick=async()=>{const rows=[];out.textContent='Running';for(const r of [...route.options])for(const w of ['375','390','1440']){frame.style.width=w+'px';await load(r.value);const d=frame.contentDocument,v=frame.contentWindow;rows.push({url:r.value,width:+w,innerWidth:v.innerWidth,scrollWidth:d.documentElement.scrollWidth,h1:d.querySelectorAll('h1').length,canonical:d.querySelector('link[rel=canonical]')?.href,hero:d.querySelector('.editorial-media--hero img')?{width:d.querySelector('.editorial-media--hero img').clientWidth,height:d.querySelector('.editorial-media--hero img').clientHeight}:null,loadedImages:[...d.images].filter(x=>x.complete&&x.naturalWidth).length,brokenImages:[...d.images].filter(x=>x.complete&&!x.naturalWidth).map(x=>x.src),quoteLinks:d.querySelectorAll('a[href="/contact#quote-form"]').length,counts:[...d.querySelectorAll('[data-blog-filter]')].map(x=>x.textContent)});}out.textContent=JSON.stringify(rows,null,2);frame.style.width='390px';width.value='390';route.value=route.options[0].value;await load(route.value);};
</script></body></html>
