name: Preview Acceptance
on:
  deployment_status:
jobs:
  accept:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.environment_url, 'https://visfurn-wood-door-site-') && endsWith(github.event.deployment_status.environment_url, '-danny-4173s-projects.vercel.app')
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.deployment_status.environment_url }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PAGES: "/es/puertas-para-proyectos /solutions/door-schedule-quotation /contact / /products/interior-doors/white-moulded-solid-wood /products/hospital-doors /products/hospital-doors/modern-laboratory-door /products/hospital-doors/automatic-hermetic-sliding-door"
      FILES: "/sitemap.xml /llms.txt /assets/main.js /robots.txt /2ad5155b9f4d0513e7f5dd67940e8a13.txt /downloads/door-schedule-template.csv /assets/content/asset-path-rules.json"
      PRIVATE: "/.github/workflows/preview-acceptance.yml /scripts/check-es-latam-landing.py /.vercelignore /download-log.txt /.gitignore /.DS_Store /images/.DS_Store /source/.vercel/output/config.json /source/.vercel/output/static/robots.txt"
      PW: "playwright@1.47.2"
    steps:
      - name: HTTP status check
        run: |
          mkdir -p out
          H=(); [ -n "$BYPASS" ] && H=(-H "x-vercel-protection-bypass: $BYPASS")
          for p in $PAGES $FILES; do
            curl -sS -o /dev/null "${H[@]}" \
              -w "$p status=%{http_code} redirect=%{redirect_url}\n" \
              --connect-timeout 15 --max-time 30 "$BASE$p" | tee -a out/status.txt
          done
          for p in $PRIVATE; do
            curl -sS -o /dev/null "${H[@]}" \
              -w "EXPOSURE $p status=%{http_code}\n" \
              --connect-timeout 15 --max-time 30 "$BASE$p" | tee -a out/status.txt
          done
      - name: Content checks
        run: |
          H=(); [ -n "$BYPASS" ] && H=(-H "x-vercel-protection-bypass: $BYPASS")
          check() {
            if curl -sS "${H[@]}" --connect-timeout 15 --max-time 30 "$BASE$1" | grep -Eq "$2"; then
              echo "CHECK $3 = PASS" | tee -a out/status.txt
            else
              echo "CHECK $3 = FAIL" | tee -a out/status.txt
            fi
          }
          check /solutions/door-schedule-quotation "hreflang=[\"']es" "solutions_hreflang_es"
          check /es/puertas-para-proyectos "hreflang=[\"']en" "es_hreflang_en"
          check /es/puertas-para-proyectos "<html[^>]*lang=[\"']es" "es_html_lang"
          check /contact "gclid" "contact_gclid_markup"
          check /sitemap.xml "/es/puertas-para-proyectos" "sitemap_es_url"
          check /llms.txt "puertas-para-proyectos" "llms_es_url"
      - name: Hospital doors preview acceptance
        run: |
          set -euo pipefail
          H=(); [ -n "$BYPASS" ] && H=(-H "x-vercel-protection-bypass: $BYPASS")
          check_page() {
            local path="$1" marker="$2" output="out/$(echo "$1" | tr '/' '_').html"
            local code
            code=$(curl -sS -L --connect-timeout 15 --max-time 30 "${H[@]}" -o "$output" -w '%{http_code}' "$BASE$path")
            echo "$path status=$code" | tee -a out/status.txt
            test "$code" = 200
            grep -Fq "$marker" "$output"
          }
          check_page /products/hospital-doors '<h1>Hospital Doors Collection</h1>'
          check_page /products/hospital-doors/modern-laboratory-door '<h1 id="lab-title">Double Swing Laboratory Door for Healthcare Projects</h1>'
          grep -Fq '<strong>Quote by specification</strong>' out/_products_hospital-doors_modern-laboratory-door.html
          check_page /products/hospital-doors/automatic-hermetic-sliding-door '<h1 class="vf-h1">Automatic Sliding Door for Clinical Openings</h1>'
          grep -Fq 'href="/products/hospital-doors/automatic-hermetic-sliding-door"' out/_products_hospital-doors.html
          grep -Fq 'href="/products/hospital-doors/modern-laboratory-door"' out/_products_hospital-doors.html
          grep -Fq 'rel="canonical" href="https://www.visfurn.com/products/hospital-doors/automatic-hermetic-sliding-door"' out/_products_hospital-doors_automatic-hermetic-sliding-door.html
          grep -Fq 'href="/contact#quote-form"' out/_products_hospital-doors_automatic-hermetic-sliding-door.html
          for asset in /assets/images/products/hospital-doors/responsive/automatic-hermetic-sliding-door-front-1200.webp /assets/styles-v3-pdp-fix.css; do
            code=$(curl -sS -L --connect-timeout 15 --max-time 30 "${H[@]}" -o /dev/null -w '%{http_code}' "$BASE$asset")
            echo "$asset status=$code" | tee -a out/status.txt
            test "$code" = 200
          done
      - name: Screenshots and attribution (authenticated headers)
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i --silent $PW
          npx playwright install --with-deps chromium
          cat > acceptance.js <<'EOF2'
          const { chromium, devices } = require('playwright');
          const path = require('path');
          (async () => {
            const b = await chromium.launch();
            const headers = process.env.BYPASS ? { 'x-vercel-protection-bypass': process.env.BYPASS } : {};
            for (const [name, options] of [['desktop', { viewport: { width: 1440, height: 900 } }], ['mobile', devices['Pixel 5']]]) {
              const context = await b.newContext({ ...options, extraHTTPHeaders: headers });
              const page = await context.newPage();
              for (const p of process.env.PAGES.split(/\s+/)) {
                await page.goto(process.env.BASE + p, { waitUntil: 'networkidle' });
                await page.screenshot({ path: path.join(process.env.GITHUB_WORKSPACE, 'out', name + p.replaceAll('/', '_') + '.png'), fullPage: true });
              }
              await context.close();
            }
            const context = await b.newContext({ extraHTTPHeaders: headers });
            const page = await context.newPage();
            await page.goto(process.env.BASE + '/contact?gclid=TESTGCLID123', { waitUntil: 'networkidle' });
            const values = await page.$$eval('input', els => els.filter(e => /gclid/i.test(e.name + ' ' + e.id)).map(e => e.value));
            console.log('GCLID_FIELDS ' + (values.length ? values.join(' ') : 'NONE'));
            await b.close();
          })().catch(error => { console.error(error.message); process.exit(1); });
          EOF2
          node acceptance.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-acceptance
          path: out

