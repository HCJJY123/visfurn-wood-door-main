<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Primed versus finished interior door procurement</title><desc id="desc">Primed door procurement includes an agreed local finishing step. Finished door procurement includes approval of the final surface and transport protection.</desc><rect width="1080" height="600" fill="#f7f2e9"/><g font-family="Arial,sans-serif" fill="#35291f"><text x="48" y="57" font-size="29" font-weight="700">A white photograph does not define the finish</text><rect x="40" y="91" width="480" height="406" rx="10" fill="#fff" stroke="#d8c9b6"/><rect x="560" y="91" width="480" height="406" rx="10" fill="#fff" stroke="#d8c9b6"/><text x="72" y="139" font-size="26" font-weight="700">WHITE PRIMED</text><text x="592" y="139" font-size="26" font-weight="700">WHITE FINISHED</text><g font-size="23"><text x="72" y="205">Approve the substrate</text><text x="72" y="253">Confirm primer condition</text><text x="72" y="301">Agree local paint process</text><text x="72" y="349">Coordinate frames and trim</text><text x="72" y="397">Protect before finishing</text><text x="592" y="205">Approve final color and sheen</text><text x="592" y="253">Confirm surface system</text><text x="592" y="301">Agree edges and machining</text><text x="592" y="349">Match leaf, frame and trim</text><text x="592" y="397">Approve transit protection</text></g><text x="72" y="458" font-size="20" fill="#655c52">Further finishing is planned.</text><text x="592" y="458" font-size="20" fill="#655c52">Final surface is part of approval.</text><text x="48" y="548" font-size="21">Choose supply scope and assembly separately for either route.</text><text x="48" y="582" font-size="17" fill="#655c52">Procurement diagram only. Model availability and finish compatibility require review.</text></g></svg>