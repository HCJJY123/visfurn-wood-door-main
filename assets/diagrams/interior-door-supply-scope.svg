<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Three interior door quotation scopes</title><desc id="desc">A door leaf, a leaf with frame and trim, and a hardware schedule are separate quotation decisions. Assembly and finishing are confirmed separately.</desc>
<rect width="1080" height="620" fill="#f7f2e9"/><text x="48" y="56" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#35291f">Define the package before comparing prices</text>
<g font-family="Arial,sans-serif" fill="#35291f">
<rect x="40" y="88" width="318" height="418" rx="10" fill="#fff" stroke="#d8c9b6"/><rect x="380" y="88" width="318" height="418" rx="10" fill="#fff" stroke="#d8c9b6"/><rect x="720" y="88" width="318" height="418" rx="10" fill="#fff" stroke="#d8c9b6"/>
<text x="66" y="130" font-size="22" font-weight="700">1. Door leaf only</text><rect x="132" y="165" width="130" height="220" fill="#d5b390" stroke="#79583c" stroke-width="3"/><circle cx="244" cy="283" r="5" fill="#79583c"/>
<text x="66" y="429" font-size="19">Frame compatibility</text><text x="66" y="457" font-size="19">and machining to confirm</text>
<text x="406" y="130" font-size="22" font-weight="700">2. Leaf + frame + trim</text><path d="M454 385V162h169v223M443 385V151h191v234" fill="none" stroke="#79583c" stroke-width="8"/><rect x="465" y="172" width="147" height="213" fill="#d5b390" stroke="#79583c" stroke-width="2"/><circle cx="594" cy="283" r="5" fill="#79583c"/>
<text x="406" y="429" font-size="19">Jamb depth, trim faces</text><text x="406" y="457" font-size="19">and assembly to confirm</text>
<text x="746" y="130" font-size="22" font-weight="700">3. Specified hardware</text><rect x="772" y="164" width="216" height="220" rx="6" fill="#f7f2e9" stroke="#d8c9b6"/><g font-size="21"><text x="796" y="208">Lock / latch</text><text x="796" y="251">Hinges</text><text x="796" y="294">Handle set</text><text x="796" y="337">Preparation</text></g>
<text x="746" y="429" font-size="19">Itemize supply separately</text><text x="746" y="457" font-size="19">from drilling / routing</text>
<text x="48" y="554" font-size="21">Also confirm: finish state · handing · packing · destination</text><text x="48" y="589" font-size="17" fill="#655c52">Scope illustration only. No dimensions, performance ratings or included items are implied.</text></g></svg>