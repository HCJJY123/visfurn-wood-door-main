<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">WPC construction review records</title><desc id="desc">Ask for a leaf section, fixing detail, frame scope and evidence that identify the same offered model.</desc><rect width="1200" height="760" fill="#f0f3ee"/><text x="64" y="82" fill="#17382c" font-size="40" font-family="Arial,sans-serif" font-weight="700">Compare the offered model</text><text x="64" y="126" fill="#47594d" font-size="24" font-family="Arial,sans-serif">Four records before sample or price approval</text><rect x="64" y="175" width="514" height="194" rx="14" fill="#fff" stroke="#c7d2c9"/><text x="90" y="220" fill="#96502e" font-size="22" font-family="Arial,sans-serif" font-weight="700">01</text><text x="90" y="261" fill="#17382c" font-size="29" font-family="Arial,sans-serif" font-weight="700">Leaf section</text><text x="90" y="303" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Facing and core or cavities</text><text x="90" y="335" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Edges, joints and finish</text><rect x="622" y="175" width="514" height="194" rx="14" fill="#fff" stroke="#c7d2c9"/><text x="648" y="220" fill="#96502e" font-size="22" font-family="Arial,sans-serif" font-weight="700">02</text><text x="648" y="261" fill="#17382c" font-size="29" font-family="Arial,sans-serif" font-weight="700">Hardware fixing</text><text x="648" y="303" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Hinge and lock location</text><text x="648" y="335" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Fixing detail and template</text><rect x="64" y="405" width="514" height="194" rx="14" fill="#fff" stroke="#c7d2c9"/><text x="90" y="450" fill="#96502e" font-size="22" font-family="Arial,sans-serif" font-weight="700">03</text><text x="90" y="491" fill="#17382c" font-size="29" font-family="Arial,sans-serif" font-weight="700">Frame and set scope</text><text x="90" y="533" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Frame, trim and wall depth</text><text x="90" y="565" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Supplied vs prepared hardware</text><rect x="622" y="405" width="514" height="194" rx="14" fill="#fff" stroke="#c7d2c9"/><text x="648" y="450" fill="#96502e" font-size="22" font-family="Arial,sans-serif" font-weight="700">04</text><text x="648" y="491" fill="#17382c" font-size="29" font-family="Arial,sans-serif" font-weight="700">Model evidence</text><text x="648" y="533" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Sample and drawing revision</text><text x="648" y="565" fill="#47594d" font-size="23" font-family="Arial,sans-serif">Required performance records</text><text x="64" y="676" fill="#17382c" font-size="26" font-family="Arial,sans-serif" font-weight="700">Tie every record to one door mark and revision.</text><text x="64" y="716" fill="#47594d" font-size="20" font-family="Arial,sans-serif">Procurement checklist · not a construction section or performance rating</text></svg>